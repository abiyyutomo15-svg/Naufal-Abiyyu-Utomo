<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm bg-[#1A0C2B] rounded-2xl shadow-[0_0_20px_#8A2BE2] p-6 space-y-4 border-2 border-[#8A2BE2]">
        
        <div>
            <img id="statusImage" 
                 src="https://placehold.co/400x100/1E90FF/FFFFFF?text=KALKULATOR" 
                 alt="Status Kalkulator"
                 class="w-full rounded-lg transition-all duration-300 ease-in-out shadow-inner border border-[#00FFFF]">
        </div>

        <div class="bg-[#2D0052] rounded-lg p-4 shadow-inner border border-[#FF00FF]">
            <input type="text" id="display" 
                   class="w-full bg-transparent text-right text-5xl font-mono text-[#FF00FF] border-0 outline-none p-2" 
                   readonly 
                   placeholder="0">
        </div>

        <div class="grid grid-cols-4 gap-3">
            <button data-value="C" class="btn-calc text-2xl font-bold bg-red-600 hover:bg-red-500 rounded-lg p-5 shadow-md text-white border border-white">C</button>
            <button data-value="DEL" class="btn-calc text-2xl font-bold bg-[#8A2BE2] hover:bg-[#9400D3] rounded-lg p-5 shadow-md text-white btn-neon-purple">DEL</button>
            <button data-value="%" class="btn-calc text-2xl font-bold bg-[#8A2BE2] hover:bg-[#9400D3] rounded-lg p-5 shadow-md text-white btn-neon-purple">%</button>
            <button data-value="/" class="btn-calc text-2xl font-bold bg-[#00CED1] hover:bg-[#00BFFF] rounded-lg p-5 shadow-md text-gray-900 btn-neon-cyan">/</button>

            <button data-value="7" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-md text-[#FF00FF] btn-neon-purple">7</button>
            <button data-value="8" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-md text-[#FF00FF] btn-neon-purple">8</button>
            <button data-value="9" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-md text-[#FF00FF] btn-neon-purple">9</button>
            <button data-value="*" class="btn-calc text-2xl font-bold bg-[#00CED1] hover:bg-[#00BFFF] rounded-lg p-5 shadow-md text-gray-900 btn-neon-cyan">*</button>

            <button data-value="4" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-md text-[#FF00FF] btn-neon-purple">4</button>
            <button data-value="5" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-md text-[#FF00FF] btn-neon-purple">5</button>
            <button data-value="6" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-md text-[#FF00FF] btn-neon-purple">6</button>
            <button data-value="-" class="btn-calc text-2xl font-bold bg-[#00CED1] hover:bg-[#00BFFF] rounded-lg p-5 shadow-md text-gray-900 btn-neon-cyan">-</button>

            <button data-value="1" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-md text-[#FF00FF] btn-neon-purple">1</button>
            <button data-value="2" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-md text-[#FF00FF] btn-neon-purple">2</button>
            <button data-value="3" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-md text-[#FF00FF] btn-neon-purple">3</button>
            <button data-value="+" class="btn-calc text-2xl font-bold bg-[#00CED1] hover:bg-[#00BFFF] rounded-lg p-5 shadow-md text-gray-900 btn-neon-cyan">+</button>

            <button data-value="0" class="btn-calc col-span-2 text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-md text-[#FF00FF] btn-neon-purple">0</button>
            <button data-value="." class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-md text-[#FF00FF] btn-neon-purple">.</button>
            <button data-value="=" class="btn-calc text-2xl font-bold bg-[#00CED1] hover:bg-[#00BFFF] rounded-lg p-5 shadow-md text-gray-900 btn-neon-cyan">=</button>
        </div>
        
        <div class="text-xs text-[#00FFFF] text-center pt-2">
            <p>Dibuat oleh: Naufal Abiyyu Utomo</p>
            <p>NIM: 1710624155</p>
        </div>

    </div>
    <script src="script"><</script>
</body>
</html>
